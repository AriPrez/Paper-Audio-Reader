[project]
name = "paper-audio-reader"
version = "0.1.0"
description = "Local PDF rectangle reader with biomedical-safe cleanup and online speech synthesis"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"

[tool.pytest.ini_options]
testpaths = ["."]
python_files = ["test_*.py"]
addopts = "--strict-markers"
